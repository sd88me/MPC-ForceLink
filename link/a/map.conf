# Version A bridge mapping overrides (hex). Read when the bridge starts (forcelink a). Examples:
#   btn 0a 05       Live III SET -> Force MASTER
#   btn 52 -        ignore Live III PLAY
#   led 3 7         Force button LED value 3 -> Live III value 7
#   quad 38 00      Force pad idx 0x38 (row 7, col 0) -> Live III LED 0x00 (one line per Force pad: full 8x8 mirror)
